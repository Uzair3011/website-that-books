<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="What the free audit delivers: a short screen-recorded video review of your website and Google presence, beside a one-page written summary listing the three highest-priority improvements.">
  <rect width="1000" height="760" fill="#f4f5ef"/>

  <!-- Video review -->
  <rect x="40" y="56" width="560" height="360" rx="16" fill="#071313"/>
  <rect x="64" y="80" width="512" height="252" rx="8" fill="#112624" stroke="#263a38"/>
  <g fill="#263a38"><circle cx="86" cy="100" r="5"/><circle cx="102" cy="100" r="5"/><circle cx="118" cy="100" r="5"/></g>
  <rect x="140" y="94" width="200" height="12" rx="6" fill="#071313"/>
  <g fill="#263a38">
    <rect x="88" y="132" width="220" height="12" rx="6"/>
    <rect x="88" y="158" width="160" height="12" rx="6"/>
    <rect x="88" y="196" width="300" height="8" rx="4"/>
    <rect x="88" y="214" width="256" height="8" rx="4"/>
    <rect x="88" y="248" width="120" height="30" rx="15"/>
    <rect x="384" y="132" width="168" height="146" rx="8"/>
  </g>
  <!-- cursor highlight on the weak call to action -->
  <rect x="82" y="242" width="132" height="42" rx="21" fill="none" stroke="#c9ff4a" stroke-width="3"/>
  <path d="m206 292 24 26-11 3 7 14-8 4-7-14-9 7Z" fill="#c9ff4a" stroke="#071313" stroke-width="2" stroke-linejoin="round"/>
  <!-- play control -->
  <circle cx="320" cy="206" r="40" fill="#c9ff4a"/>
  <path d="m310 190 24 16-24 16Z" fill="#071313"/>
  <!-- scrubber -->
  <rect x="64" y="356" width="512" height="6" rx="3" fill="#263a38"/>
  <rect x="64" y="356" width="196" height="6" rx="3" fill="#83e7da"/>
  <text x="64" y="392" font-family="Manrope, system-ui, Arial, sans-serif" font-size="15" font-weight="600" fill="#a7b6b3">Screen-recorded review &#183; about 5 minutes</text>

  <!-- One-page summary -->
  <rect x="640" y="30" width="320" height="418" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
  <rect x="672" y="62" width="128" height="12" rx="6" fill="#071313"/>
  <rect x="672" y="86" width="196" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="672" y="116" width="256" height="1" fill="#d5d7d2"/>

  <text x="672" y="146" font-family="Manrope, system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#66706d">PRIORITY 1</text>
  <rect x="672" y="158" width="188" height="10" rx="5" fill="#071313"/>
  <rect x="672" y="178" width="240" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="672" y="196" width="180" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="656" y="140" width="4" height="68" rx="2" fill="#c9ff4a"/>

  <text x="672" y="248" font-family="Manrope, system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#66706d">PRIORITY 2</text>
  <rect x="672" y="260" width="164" height="10" rx="5" fill="#071313"/>
  <rect x="672" y="280" width="240" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="672" y="298" width="204" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="656" y="242" width="4" height="68" rx="2" fill="#83e7da"/>

  <text x="672" y="350" font-family="Manrope, system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#66706d">PRIORITY 3</text>
  <rect x="672" y="362" width="204" height="10" rx="5" fill="#071313"/>
  <rect x="672" y="382" width="240" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="672" y="400" width="152" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="656" y="344" width="4" height="68" rx="2" fill="#66706d"/>

  <!-- Where enquiries leak -->
  <rect x="40" y="466" width="560" height="254" rx="16" fill="#ffffff" stroke="#d5d7d2"/>
  <rect x="72" y="498" width="212" height="12" rx="6" fill="#071313"/>
  <rect x="72" y="524" width="280" height="8" rx="4" fill="#a7b6b3"/>

  <!-- funnel bars: where enquiries are lost -->
  <g>
    <rect x="72" y="562" width="496" height="28" rx="6" fill="#112624"/>
    <rect x="72" y="602" width="380" height="28" rx="6" fill="#263a38"/>
    <rect x="72" y="642" width="252" height="28" rx="6" fill="#83e7da"/>
    <rect x="72" y="682" width="140" height="28" rx="6" fill="#c9ff4a"/>
  </g>
  <g font-family="Manrope, system-ui, Arial, sans-serif" font-size="13" font-weight="600" fill="#66706d">
    <text x="584" y="581">Found</text>
    <text x="468" y="621">Visited</text>
    <text x="340" y="661">Engaged</text>
    <text x="228" y="701">Enquired</text>
  </g>

  <rect x="640" y="466" width="320" height="254" rx="14" fill="#071313"/>
  <rect x="672" y="498" width="160" height="12" rx="6" fill="#ffffff"/>
  <rect x="672" y="524" width="240" height="8" rx="4" fill="#a7b6b3"/>
  <rect x="672" y="542" width="196" height="8" rx="4" fill="#a7b6b3"/>
  <g>
    <rect x="672" y="580" width="256" height="40" rx="10" fill="#112624"/>
    <rect x="696" y="595" width="120" height="10" rx="5" fill="#a7b6b3"/>
    <rect x="672" y="630" width="256" height="40" rx="10" fill="#112624"/>
    <rect x="696" y="645" width="164" height="10" rx="5" fill="#a7b6b3"/>
  </g>
  <rect x="672" y="682" width="152" height="12" rx="6" fill="#c9ff4a"/>
</svg>
