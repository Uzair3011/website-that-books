<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="A med-spa clinic website design: a dark hero with the clinic name and a book-consultation button, a treatment list with prices, and a live booking panel showing selectable dates and times with a confirmed slot.">
  <defs>
    <clipPath id="c-clip"><rect x="40" y="88" width="1200" height="772" rx="8"/></clipPath>
    <linearGradient id="c-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112624"/><stop offset="1" stop-color="#071313"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#83e7da" stop-opacity=".55"/><stop offset="1" stop-color="#83e7da" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="900" fill="#f4f5ef"/>
  <rect x="40" y="40" width="1200" height="820" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
  <g fill="#d5d7d2"><circle cx="72" cy="64" r="6"/><circle cx="94" cy="64" r="6"/><circle cx="116" cy="64" r="6"/></g>
  <rect x="150" y="52" width="360" height="22" rx="11" fill="#f4f5ef"/>
  <text x="168" y="68" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#a7b6b3">lumiereaesthetics.co.uk</text>

  <g clip-path="url(#c-clip)" font-family="Manrope, Inter, Segoe UI, Arial, sans-serif">
    <!-- dark hero -->
    <rect x="40" y="88" width="1200" height="404" fill="url(#c-hero)"/>
    <ellipse cx="1040" cy="150" rx="420" ry="280" fill="url(#c-glow)"/>
    <text x="88" y="140" font-size="22" font-weight="700" fill="#ffffff">Lumière <tspan fill="#83e7da">Aesthetics</tspan></text>
    <g font-size="14" font-weight="500" fill="#a7b6b3">
      <text x="700" y="139">Treatments</text><text x="800" y="139">Prices</text><text x="866" y="139">About</text><text x="930" y="139">Contact</text>
    </g>
    <rect x="1012" y="118" width="164" height="34" rx="17" fill="#c9ff4a"/>
    <text x="1094" y="140" font-size="14" font-weight="700" fill="#071313" text-anchor="middle">Book consultation</text>

    <text x="88" y="212" font-size="13" font-weight="700" letter-spacing="2.2" fill="#83e7da">MIDDLESBROUGH CLINIC</text>
    <g font-size="46" font-weight="700" letter-spacing="-1.8" fill="#ffffff">
      <text x="88" y="276">Advanced skin and</text>
      <text x="88" y="330">aesthetic treatments.</text>
    </g>
    <text x="88" y="376" font-size="17" fill="#a7b6b3">Consultations seven days a week, with a</text>
    <text x="88" y="400" font-size="17" fill="#a7b6b3">qualified practitioner. No obligation.</text>
    <rect x="88" y="424" width="196" height="50" rx="25" fill="#c9ff4a"/>
    <text x="186" y="455" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">Book a consultation</text>
    <rect x="300" y="424" width="150" height="50" rx="25" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="375" y="455" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">See prices</text>

    <!-- booking panel floating over the hero -->
    <rect x="712" y="200" width="468" height="292" rx="18" fill="#ffffff"/>
    <text x="744" y="240" font-size="18" font-weight="700" fill="#071313">Choose your appointment</text>
    <text x="744" y="264" font-size="13" fill="#66706d">Live availability · 30-minute consultation</text>
    <g>
      <rect x="744" y="284" width="76" height="62" rx="12" fill="#f4f5ef"/>
      <text x="782" y="308" font-size="12" font-weight="600" fill="#66706d" text-anchor="middle">Tue</text>
      <text x="782" y="330" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">23</text>
      <rect x="832" y="284" width="76" height="62" rx="12" fill="#071313"/>
      <text x="870" y="308" font-size="12" font-weight="600" fill="#a7b6b3" text-anchor="middle">Wed</text>
      <text x="870" y="330" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">24</text>
      <rect x="920" y="284" width="76" height="62" rx="12" fill="#f4f5ef"/>
      <text x="958" y="308" font-size="12" font-weight="600" fill="#66706d" text-anchor="middle">Thu</text>
      <text x="958" y="330" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">25</text>
      <rect x="1008" y="284" width="76" height="62" rx="12" fill="#f4f5ef"/>
      <text x="1046" y="308" font-size="12" font-weight="600" fill="#66706d" text-anchor="middle">Fri</text>
      <text x="1046" y="330" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">26</text>
      <rect x="1096" y="284" width="76" height="62" rx="12" fill="#f4f5ef"/>
      <text x="1134" y="308" font-size="12" font-weight="600" fill="#66706d" text-anchor="middle">Sat</text>
      <text x="1134" y="330" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">27</text>
    </g>
    <g font-size="14" font-weight="600">
      <rect x="744" y="366" width="96" height="44" rx="12" fill="#f4f5ef"/>
      <text x="792" y="394" fill="#071313" text-anchor="middle">09:30</text>
      <rect x="852" y="366" width="96" height="44" rx="12" fill="#f4f5ef"/>
      <text x="900" y="394" fill="#071313" text-anchor="middle">11:00</text>
      <rect x="960" y="366" width="96" height="44" rx="12" fill="#83e7da"/>
      <text x="1008" y="394" fill="#071313" text-anchor="middle">14:15</text>
      <rect x="1068" y="366" width="96" height="44" rx="12" fill="#f4f5ef"/>
      <text x="1116" y="394" fill="#071313" text-anchor="middle">16:45</text>
    </g>
    <rect x="744" y="428" width="420" height="48" rx="24" fill="#071313"/>
    <text x="954" y="458" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Confirm Wednesday 24th, 14:15</text>

    <!-- treatments -->
    <text x="88" y="560" font-size="13" font-weight="700" letter-spacing="2.2" fill="#66706d">POPULAR TREATMENTS</text>
    <text x="88" y="606" font-size="30" font-weight="700" letter-spacing="-1.2" fill="#071313">Clear pricing, before you book.</text>
    <g>
      <rect x="88" y="644" width="266" height="176" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
      <rect x="88" y="644" width="266" height="76" rx="14" fill="#112624"/>
      <text x="112" y="690" font-size="15" font-weight="700" fill="#83e7da">Skin &amp; anti-ageing</text>
      <text x="112" y="752" font-size="17" font-weight="700" fill="#071313">Consultation</text>
      <text x="112" y="778" font-size="14" fill="#66706d">45 minutes</text>
      <text x="330" y="752" font-size="17" font-weight="700" fill="#071313" text-anchor="end">Free</text>

      <rect x="376" y="644" width="266" height="176" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
      <rect x="376" y="644" width="266" height="76" rx="14" fill="#83e7da"/>
      <text x="400" y="690" font-size="15" font-weight="700" fill="#071313">Injectables</text>
      <text x="400" y="752" font-size="17" font-weight="700" fill="#071313">Single area</text>
      <text x="400" y="778" font-size="14" fill="#66706d">From</text>
      <text x="618" y="752" font-size="17" font-weight="700" fill="#071313" text-anchor="end">£165</text>

      <rect x="664" y="644" width="266" height="176" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
      <rect x="664" y="644" width="266" height="76" rx="14" fill="#c9ff4a"/>
      <text x="688" y="690" font-size="15" font-weight="700" fill="#071313">Skin peels</text>
      <text x="688" y="752" font-size="17" font-weight="700" fill="#071313">Course of three</text>
      <text x="688" y="778" font-size="14" fill="#66706d">Save £60</text>
      <text x="906" y="752" font-size="17" font-weight="700" fill="#071313" text-anchor="end">£390</text>

      <rect x="952" y="644" width="228" height="176" rx="14" fill="#071313"/>
      <text x="976" y="686" font-size="17" font-weight="700" fill="#ffffff">Not sure where</text>
      <text x="976" y="710" font-size="17" font-weight="700" fill="#ffffff">to start?</text>
      <text x="976" y="740" font-size="13" fill="#a7b6b3">Ask our team anything.</text>
      <rect x="976" y="758" width="180" height="40" rx="20" fill="#c9ff4a"/>
      <text x="1066" y="783" font-size="14" font-weight="700" fill="#071313" text-anchor="middle">Chat with us</text>
    </g>
  </g>
</svg>
