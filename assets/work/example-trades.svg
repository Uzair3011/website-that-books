<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-label="A home-services website design: a dark hero with a large phone number, a plainly stated list of areas covered, three service cards with prices, and a quote request form.">
  <defs>
    <clipPath id="t-clip"><rect x="40" y="88" width="1200" height="772" rx="8"/></clipPath>
    <linearGradient id="t-img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263a38"/><stop offset="1" stop-color="#071313"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="900" fill="#f4f5ef"/>
  <rect x="40" y="40" width="1200" height="820" rx="14" fill="#ffffff" stroke="#d5d7d2"/>
  <g fill="#d5d7d2"><circle cx="72" cy="64" r="6"/><circle cx="94" cy="64" r="6"/><circle cx="116" cy="64" r="6"/></g>
  <rect x="150" y="52" width="360" height="22" rx="11" fill="#f4f5ef"/>
  <text x="168" y="68" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#a7b6b3">teessideboilercare.co.uk</text>

  <g clip-path="url(#t-clip)" font-family="Manrope, Inter, Segoe UI, Arial, sans-serif">
    <!-- dark hero -->
    <rect x="40" y="88" width="1200" height="448" fill="#071313"/>
    <text x="88" y="140" font-size="21" font-weight="700" fill="#ffffff">Teesside <tspan fill="#c9ff4a">Boiler Care</tspan></text>
    <g font-size="14" font-weight="500" fill="#a7b6b3">
      <text x="660" y="139">Boiler repair</text><text x="762" y="139">Servicing</text><text x="846" y="139">Areas</text></g>
    <rect x="916" y="116" width="260" height="40" rx="20" fill="#c9ff4a"/>
    <text x="1046" y="142" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">01642 000 000</text>

    <text x="88" y="212" font-size="13" font-weight="700" letter-spacing="2.2" fill="#c9ff4a">GAS SAFE REGISTERED · NO CALLOUT FEE</text>
    <g font-size="48" font-weight="700" letter-spacing="-2" fill="#ffffff">
      <text x="88" y="280">Boiler broken?</text>
      <text x="88" y="336">We can be there</text>
      <text x="88" y="392">today.</text>
    </g>
    <text x="88" y="436" font-size="17" fill="#a7b6b3">Repairs, servicing and new installations across Teesside.</text>
    <rect x="88" y="462" width="214" height="52" rx="26" fill="#c9ff4a"/>
    <text x="195" y="495" font-size="16" font-weight="700" fill="#071313" text-anchor="middle">Call 01642 000 000</text>
    <rect x="318" y="462" width="176" height="52" rx="26" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="406" y="495" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Get a fixed quote</text>

    <!-- hero photo block -->
    <rect x="700" y="196" width="476" height="300" rx="16" fill="url(#t-img)" stroke="#263a38"/>
    <circle cx="938" cy="316" r="56" fill="#c9ff4a"/>
    <path d="M918 316h40m-20-20v40" stroke="#071313" stroke-width="7" stroke-linecap="round"/>
    <text x="938" y="416" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Engineers on the road</text>
    <text x="938" y="442" font-size="14" fill="#a7b6b3" text-anchor="middle">7am – 8pm, seven days</text>

    <!-- areas covered -->
    <rect x="40" y="536" width="1200" height="118" fill="#f4f5ef"/>
    <text x="88" y="580" font-size="13" font-weight="700" letter-spacing="2.2" fill="#66706d">AREAS WE COVER</text>
    <g font-size="15" font-weight="600" fill="#071313">
      <rect x="88" y="598" width="148" height="36" rx="18" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="162" y="622" text-anchor="middle">Middlesbrough</text>
      <rect x="248" y="598" width="126" height="36" rx="18" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="311" y="622" text-anchor="middle">Stockton</text>
      <rect x="386" y="598" width="106" height="36" rx="18" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="439" y="622" text-anchor="middle">Redcar</text>
      <rect x="504" y="598" width="126" height="36" rx="18" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="567" y="622" text-anchor="middle">Billingham</text>
      <rect x="642" y="598" width="130" height="36" rx="18" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="707" y="622" text-anchor="middle">Hartlepool</text>
      <rect x="784" y="598" width="128" height="36" rx="18" fill="#071313"/>
      <text x="848" y="622" fill="#ffffff" text-anchor="middle">Tees Valley</text>
    </g>

    <!-- services + quote form -->
    <text x="88" y="708" font-size="26" font-weight="700" letter-spacing="-1" fill="#071313">What we fix</text>
    <g>
      <rect x="88" y="736" width="226" height="102" rx="12" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="112" y="774" font-size="16" font-weight="700" fill="#071313">Boiler repair</text>
      <text x="112" y="800" font-size="13" fill="#66706d">Diagnosis and fix,</text>
      <text x="112" y="820" font-size="13" fill="#66706d">most parts in van</text>
      <rect x="334" y="736" width="226" height="102" rx="12" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="358" y="774" font-size="16" font-weight="700" fill="#071313">Annual service</text>
      <text x="358" y="800" font-size="13" fill="#66706d">Full safety check</text>
      <text x="520" y="800" font-size="15" font-weight="700" fill="#071313" text-anchor="end">£79</text>
      <rect x="580" y="736" width="226" height="102" rx="12" fill="#ffffff" stroke="#d5d7d2"/>
      <text x="604" y="774" font-size="16" font-weight="700" fill="#071313">New boiler</text>
      <text x="604" y="800" font-size="13" fill="#66706d">Fitted, from</text>
      <text x="766" y="800" font-size="15" font-weight="700" fill="#071313" text-anchor="end">£1,850</text>
    </g>
    <rect x="846" y="708" width="330" height="152" rx="14" fill="#071313"/>
    <text x="874" y="748" font-size="17" font-weight="700" fill="#ffffff">Get a fixed quote</text>
    <rect x="874" y="766" width="274" height="36" rx="10" fill="#112624"/>
    <text x="892" y="789" font-size="13" fill="#a7b6b3">Your postcode</text>
    <rect x="874" y="812" width="274" height="40" rx="20" fill="#c9ff4a"/>
    <text x="1011" y="837" font-size="14" font-weight="700" fill="#071313" text-anchor="middle">Check availability</text>
  </g>
</svg>
